[package]
name = "socky-be"
version = "0.1.0"
edition = "2021"
default-run = "socky-be"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Async
tokio = { version = "1.49.0", features = ["full"] }

# Web
axum = "0.8.8"
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace", "request-id", "uuid", "catch-panic"] }

# Json
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.149"
serde_with = "3.7.0"

# Model
rust_decimal = "1.40.0"
uuid = { version = "1.20.0", features = ["v4", "fast-rng", "serde"] }

# Repository
sqlx = { version = "0.8.6", features = [ "runtime-tokio-rustls", "postgres", "uuid", "chrono", "rust_decimal" ] }

# Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.18", features = ["env-filter", "json"] }

# Crypto and auth
argon2 = "0.5.3"
sha2 = "0.10.9"
hmac = "0.12.1"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
rand = { "version" = "0.10.0", features = ["thread_rng"] }
secrecy = { version = "0.10.3", features = ["serde"] }

# Configuration
dotenvy = "0.15.7"
figment = { version = "0.10.19", features = ["env"] }

# Documentation
utoipa = { version = "5.3", features = ["axum_extras", "chrono", "decimal", "uuid"] }
utoipauto = "0.3.0-alpha.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }

# Helper scripts
rpassword = "7.4.0"

# Others
base64 = "0.22.1"
chrono = { version = "0.4.43", features = ["serde"] }
strum_macros = "0.27.2"
thiserror = "2.0.18"
anyhow = "1.0.102"
lazy-regex = "3.6.0"

[dev-dependencies]
reqwest = { version = "0.13.2", features = ["json"] }
hex = "0.4.3"

